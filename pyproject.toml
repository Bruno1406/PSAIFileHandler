[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psaifilehandler"
version = "0.3.0"
description = "Standardized simulation and experimental data file handler for OpenFOAM, COMSOL, and MATLAB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PSAI Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
    "netcdf4>=1.7.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyvista>=0.44.0",
    "tqdm>=4.66.0",
    "xarray>=2024.7.0",
]

[project.optional-dependencies]
matlab = [
    "matlabengine>=24.2.0",
]
openfoam = [
    "PyFoam",
]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]
all = [
    "matlabengine>=24.2.0",
    "PyFoam",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psaifilehandler"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "README.md",
    "pyproject.toml",
]
