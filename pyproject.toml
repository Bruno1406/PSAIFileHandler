[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psaifilehandler"
version = "0.1.0"
description = "Standardized simulation and experimental data file handler for OpenFOAM, COMSOL, and MATLAB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matlabengine>=24.2.0",
    "matplotlib>=3.8.0",
    "netcdf4>=1.7.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "PyFoam",
    "pyvista[jupyter]>=0.47.1",
    "scipy>=1.12.0",
    "tqdm>=4.66.0",
    "xarray>=2024.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/comsol", "src/matlab", "src/openfoam"]
